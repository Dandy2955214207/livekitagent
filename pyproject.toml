[project]
name = "livekit-vlm-agent"
version = "0.1.0"
description = "Local LiveKit and Qwen realtime visual call demo"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aiohttp>=3.14,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "livekit-agents>=1,<2",
  "livekit-api>=1,<2",
  "livekit>=1,<2",
  "websockets>=15,<17",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "psutil>=7,<8",
  "pyyaml>=6,<7",
  "livekit-plugins-silero==1.8.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
